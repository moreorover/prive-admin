name: Nightly Dependency Updates

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  taze:
    name: Run taze major
    runs-on: ubuntu-latest
    env:
      VITE_GIT_HOOKS: "0"

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Load PAT from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEPS_PAT: op://prive-admin/PAT prive-admin deps bot/token

      - name: Run taze major
        run: vp dlx taze major -r -w

      - name: Update Lockfile
        run: vp install --no-frozen-lockfile

      - name: Format Updated Files
        run: vp fmt --write

      - name: Create or Update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ env.DEPS_PAT }}
          branch: chore/auto-dep-updates
          base: main
          commit-message: "fix(deps): bump dependencies via taze major"
          title: "fix(deps): nightly dependency updates"
          body: |
            Automated nightly run of `vp dlx taze major -r -w` followed by `vp install`.

            This PR is updated each night with any newly outdated packages until merged or closed.
          labels: dependencies
          delete-branch: true
