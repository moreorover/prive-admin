name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Source Build
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: github-actions-local-test-secret-at-least-32-characters

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Install Dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Check Types
        run: vp run check-types

      - name: Run Unit Tests
        run: vp test run

      - name: Install Playwright Browser
        run: vp exec playwright install --with-deps chromium

      - name: Run End-to-End Tests
        run: vp run test:e2e

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Run Knip
        run: vp exec knip --reporter github-actions

      - name: Run Build
        run: vp run build
