name: PR Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Source Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      code-quality: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Install Dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Check Types
        run: vp run check-types

      - name: Run Tests
        run: vp test run --coverage

      - name: Add Coverage Summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"))
          const total = summary.total
          const format = (metric) => `${metric.pct}% (${metric.covered}/${metric.total})`

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Test coverage",
              "",
              "| Metric | Coverage |",
              "| --- | ---: |",
              `| Lines | ${format(total.lines)} |`,
              `| Statements | ${format(total.statements)} |`,
              `| Functions | ${format(total.functions)} |`,
              `| Branches | ${format(total.branches)} |`,
              "",
            ].join("\\n"),
          )
          NODE

      - name: Upload Coverage Report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/vitest
          fail-on-error: false

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Run Knip
        run: vp exec knip --reporter github-actions

      - name: Run Build
        run: vp run build
