name: PR Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Source Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Install Dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Check Types
        run: vp run check-types

      - name: Run Tests
        run: vp test run --coverage

      - name: Publish Coverage Summary
        if: success()
        uses: actions/github-script@v7
        env:
          COVERAGE_SUMMARY: coverage/coverage-summary.json
        with:
          script: |
            const fs = require("node:fs")
            const path = require("node:path")

            const summary = JSON.parse(fs.readFileSync(process.env.COVERAGE_SUMMARY, "utf8"))
            const total = summary.total
            const format = (metric) => `${metric.pct}% (${metric.covered}/${metric.total})`
            const rows = [
              ["Lines", total.lines],
              ["Statements", total.statements],
              ["Functions", total.functions],
              ["Branches", total.branches],
            ]

            const lines = [
              "## Test coverage",
              "",
              "| Metric | Coverage |",
              "| --- | ---: |",
              ...rows.map(([name, metric]) => `| ${name} | ${format(metric)} |`),
            ]

            if (context.eventName === "pull_request") {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: context.payload.pull_request.base.sha,
                head: context.payload.pull_request.head.sha,
              })
              const workspace = process.env.GITHUB_WORKSPACE
              const coverageByFile = new Map(
                Object.entries(summary)
                  .filter(([file]) => file !== "total")
                  .map(([file, metrics]) => [path.relative(workspace, file), metrics]),
              )
              const changedFiles = comparison.data.files
                .map((file) => file.filename)
                .filter((file) => coverageByFile.has(file))

              lines.push("", "### Changed files", "", "| File | Lines |", "| --- | ---: |")
              if (changedFiles.length === 0) {
                lines.push("| No changed source files with coverage data | — |")
              } else {
                for (const file of changedFiles) {
                  lines.push(`| \\`${file}\\` | ${format(coverageByFile.get(file).lines)} |`)
                }
              }
            }

            const body = `${lines.join("\\n")}\\n\\n<!-- coverage-report -->`
            await core.summary.addRaw(body).write()

            if (context.eventName === "pull_request" && context.payload.pull_request.head.repo.full_name === context.repo.owner + "/" + context.repo.repo) {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              })
              const existing = comments.data.find((comment) => comment.body?.includes("<!-- coverage-report -->"))
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              }

              if (existing) {
                await github.rest.issues.updateComment({ ...payload, comment_id: existing.id })
              } else {
                await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number })
              }
            }

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Run Knip
        run: vp exec knip --reporter github-actions

      - name: Run Build
        run: vp run build
