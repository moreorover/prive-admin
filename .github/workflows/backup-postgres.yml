name: Daily Postgres Backup

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  backup:
    environment:
      name: production
      url: https://prive.salon
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          POSTGRES_DB: op://prive-admin/prive-admin-prod/postgres/POSTGRES_DB
          POSTGRES_USER: op://prive-admin/prive-admin-prod/postgres/POSTGRES_USER
          R2_ACCOUNT_ID: op://prive-admin/Cloudflare R2/account-id
          R2_ACCESS_KEY_ID: op://prive-admin/Cloudflare R2/access-key-id
          R2_SECRET_ACCESS_KEY: op://prive-admin/Cloudflare R2/secret-access-key
          R2_BUCKET_NAME: op://prive-admin/Cloudflare R2/bucket-name
          TS_OAUTH_CLIENT_ID: op://prive-admin/tailscale-oauth/client-id
          TS_OAUTH_CLIENT_SECRET: op://prive-admin/tailscale-oauth/client-secret

      - name: Tailscale up
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:prod-ci

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 0700 ~/.ssh
          ssh-keyscan -H prive >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connection
        run: ssh -o ConnectTimeout=30 root@prive 'echo ok'

      - name: Stage restic env on VPS
        run: |
          umask 077
          cat > restic.env <<EOF
          RESTIC_REPOSITORY=s3:https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET_NAME}
          AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_DB=${POSTGRES_DB}
          EOF
          chmod 600 restic.env
          ssh root@prive 'umask 077 && mkdir -p /root/.restic'
          scp restic.env root@prive:/root/.restic/env
          rm -f restic.env

      - name: Run restic backup on VPS
        run: |
          ssh root@prive 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077

          if ! command -v restic >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y restic
          fi
          # `--insecure-no-password` requires restic >= 0.17 (Debian/Ubuntu
          # apt is older); upgrade to the latest from GitHub.
          restic self-update >/dev/null 2>&1 || true

          set -a
          . /root/.restic/env
          set +a

          # No restic encryption — R2 bucket is private, blob-at-rest
          # encryption is handled by Cloudflare. See `--insecure-no-password`.
          NOPW="--insecure-no-password"

          # Init repo on first run (idempotent)
          restic $NOPW snapshots >/dev/null 2>&1 || restic $NOPW init

          # Stream pg_dump straight into restic — no temp file on disk
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          docker compose --project-directory /root/prive-admin exec -T postgres \
            pg_dump -U "${POSTGRES_USER}" --clean --create "${POSTGRES_DB}" \
            | restic $NOPW backup \
                --stdin \
                --stdin-filename "${POSTGRES_DB}-${STAMP}.sql" \
                --tag postgres \
                --tag daily

          # Retention: 7 daily, 4 weekly, 6 monthly
          restic $NOPW forget --tag postgres \
            --keep-daily 7 --keep-weekly 4 --keep-monthly 6 \
            --prune

          # Integrity check (subset, fast)
          restic $NOPW check --read-data-subset=5%
          REMOTE
