packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - sharp
  - workerd

catalogMode: prefer

catalog:
  "@hono/trpc-server": 0.4.2
  "@trpc/client": 11.18.0
  "@trpc/server": 11.18.0
  "@trpc/tanstack-react-query": 11.18.0
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  better-auth: 1.6.26
  hono: 4.13.1
  react: 19.2.8
  react-dom: 19.2.8
  tsdown: 0.22.14
  tsx: 4.23.11
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2
  zod: 4.4.3

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260801.1"
