packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - sharp
  - workerd

catalogMode: prefer

catalog:
  "@hono/trpc-server": 0.4.2
  "@trpc/client": 11.18.0
  "@trpc/server": 11.18.0
  "@trpc/tanstack-react-query": 11.18.0
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  better-auth: 1.7.1
  hono: 4.13.2
  react: 19.2.8
  react-dom: 19.2.8
  tsdown: 0.22.14
  tsx: 4.23.12
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  zod: 4.4.3

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260801.1"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.74"
  - "@alchemy.run/floci@2.0.0-beta.74"
  - "@alchemy.run/node-utils@2.0.0-beta.74"
  - "@distilled.cloud/aws@1.0.0-rc.6"
  - "@distilled.cloud/axiom@1.0.0-rc.6"
  - "@distilled.cloud/cloudflare@1.0.0-rc.6"
  - "@distilled.cloud/core@1.0.0-rc.6"
  - "@distilled.cloud/fly-io@1.0.0-rc.6"
  - "@distilled.cloud/hetzner@1.0.0-rc.6"
  - "@distilled.cloud/neon@1.0.0-rc.6"
  - "@distilled.cloud/planetscale@1.0.0-rc.6"
  - alchemy@2.0.0-beta.74
  - "@mantine/charts@9.5.2"
  - "@mantine/core@9.5.2"
  - "@mantine/dates@9.5.2"
  - "@mantine/form@9.5.2"
  - "@mantine/hooks@9.5.2"
  - "@mantine/modals@9.5.2"
  - "@mantine/notifications@9.5.2"
  - "@mantine/schedule@9.5.2"
  - "@mantine/store@9.5.2"
